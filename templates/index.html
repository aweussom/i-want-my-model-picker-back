<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>i want my model picker back</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="header">
    <h1>i want my model picker back</h1>
    <div class="header-controls">
        <!-- Values are `tone` ids, sent as the OpenAI `model` parameter.
             Switching starts a new Copilot conversation: tone is per-thread. -->
        <button class="btn icon" id="history-toggle"
                title="Older conversations">&#9776;</button>
        <select id="model-select" title="Maps to the tone field on the wire"></select>
        <button class="btn icon" id="browser-toggle"
                title="Show or hide the Copilot browser doing the work">&#128065;</button>
        <div class="status-dot" id="status-dot" title="checking..."></div>
    </div>
</div>

<div class="history-panel" id="history-panel">
    <div class="history-header">
        <span>Older conversations</span>
        <button class="btn icon" id="history-refresh" title="Refresh">&#10227;</button>
    </div>
    <div class="history-list" id="history-list"></div>
    <div class="history-note">
        Opening one continues it in Copilot, and restores the model it was using.
    </div>
</div>

<div class="chat" id="chat"></div>

<div class="input-area">
    <div class="input-wrap">
        <div class="image-preview" id="image-preview">
            <img id="image-preview-img" alt="attached image">
            <button class="remove" id="image-remove" title="Remove image">&times;</button>
        </div>
        <div class="input-row">
            <textarea id="message-input" rows="1" placeholder="Type a message... (paste or drop an image to attach)"></textarea>
            <button class="btn icon" id="attach-btn" title="Attach image">&#128206;</button>
            <button class="btn" id="send-btn">Send</button>
            <button class="btn icon" id="new-chat-btn" title="New chat">&#10227;</button>
        </div>
    </div>
</div>

<div class="drop-overlay" id="drop-overlay"><span>Drop image to attach</span></div>

<div class="artifact-panel" id="artifact-panel">
    <div class="artifact-header">
        <span id="artifact-title">Artifact</span>
        <button class="btn icon" id="artifact-close" title="Close artifact">&times;</button>
    </div>
    <div class="artifact-body" id="artifact-body"></div>
</div>
<input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif" hidden>

<script src="/static/js/app.js"></script>
</body>
</html>
